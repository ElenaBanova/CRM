services:
  frontend:
    build:
      context: ./frontend
    #    ports:
    #          - "3000:3000"
    env_file:
      - .env
    volumes:
      - ./frontend:/frontend
      - /frontend/node_modules
    restart: on-failure
    command: >
      sh -c "npm run build && npm start"   

  backend:
    build:
      context: ./backend
    #    ports:
    #      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./backend:/backend
      - /backend/node_modules
    restart: on-failure
    command: >
      sh -c "npm start"

  web:
    image: nginx:alpine
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - backend
